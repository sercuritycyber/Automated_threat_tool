name = "cti-alerts"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Keep a concrete assets directory so Cloudflare Workers Builds can resolve the
# project in both deploy and version-upload modes. The Worker handler remains the
# source of all routes; this directory is intentionally empty.
[assets]
directory = "./public"

# Production hostname, as a Custom Domain rather than a plain route.
[[routes]]
pattern = "cti.securitycyber.uk"
custom_domain = true

# Subscriber database. Create once:  npx wrangler d1 create cti-subs
[[d1_databases]]
binding = "DB"
database_name = "cti-subs"
database_id = "2d514521-9be2-4c8e-8bf0-73c68bcaeafd"

[triggers]
# digests 06:15 / 11:15 / 16:15 UTC = 07:15 / 12:15 / 17:15 BST · 03:30 UTC Sunday retention + intent purge.
crons = ["15 6 * * *", "15 11 * * *", "15 16 * * *", "30 3 * * SUN"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

